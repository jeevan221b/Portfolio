# Portfolio (jeevanraj.dev). Installed on Nexus by deploy/deploy-nexus.sh as
# $PREFIX/etc/nginx/conf.d/portfolio-site.conf. Localhost only: the Cloudflare
# tunnel is the only way in, and it terminates HTTPS.

# One line per page-load beacon (src/visit.ts). The tunnel connects from
# 127.0.0.1, so the visitor's address comes from Cloudflare's header.
# deploy/visitor-stats.py hashes it with a salt that changes daily and
# truncates this log once it has been counted.
log_format portfolio_visit escape=json
    '{"t":"$time_iso8601","ip":"$http_cf_connecting_ip","ra":"$remote_addr",'
    '"ua":"$http_user_agent","r":"$arg_r","c":"$http_cf_ipcountry"}';

server {
    listen 127.0.0.1:8081;
    server_name _;

    root /data/data/com.termux/files/home/Portfolio/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Vite fingerprints everything under assets/, so it can be cached forever.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /api/hit {
        access_log /data/data/com.termux/files/home/Portfolio/visits/visits.log portfolio_visit;
        add_header Cache-Control "no-store";
        return 204;
    }
}

# Counts for Mission Control, written by deploy/visitor-stats.py (cron, every
# minute). A separate port the tunnel has no route to, so it never goes public.
server {
    listen 127.0.0.1:8082;
    server_name _;
    access_log off;

    location = /api/status {
        default_type application/json;
        add_header Cache-Control "no-store";
        alias /data/data/com.termux/files/home/Portfolio/visits/status.json;
    }

    location / {
        return 404;
    }
}
