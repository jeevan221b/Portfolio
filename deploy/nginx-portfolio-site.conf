# Portfolio (jeevanraj.dev). Installed on Nexus by deploy/deploy-nexus.sh as
# $PREFIX/etc/nginx/conf.d/portfolio-site.conf. Localhost only: the Cloudflare
# tunnel is the only way in, and it terminates HTTPS.
server {
    listen 127.0.0.1:8081;
    server_name _;

    root /data/data/com.termux/files/home/Portfolio/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Vite fingerprints everything under assets/, so it can be cached forever.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
